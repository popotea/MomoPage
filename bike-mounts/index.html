<script>
const DATA=JSON.parse(document.getElementById('products').textContent);
const $=id=>document.getElementById(id),PAGE=60;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filtered=[],shown=0,timer;
function card(d){return `<article class="card"><a class="picture" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" aria-label="查看 ${esc(d.name)}"><span>圖片暫未提供</span>${d.image?`<img src="${esc(d.image)}" alt="${esc(d.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</a><div class="body"><div class="tags"><span class="tag${d.vehicle==='車種未標示'?' unknown':''}">${esc(d.vehicle)}</span>${d.extras.map(e=>`<span class="tag extra">${esc(e)}</span>`).join('')}<span class="tag extra">${esc(d.shop_type)}</span></div><h2><a class="name" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.name)}</a></h2><div class="price">NT$ ${d.price.toLocaleString('zh-TW')} <small>搜尋頁售價</small></div><a class="visit" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">到 momo 查看商品 ↗</a></div></article>`;}
function append(){const next=filtered.slice(shown,shown+PAGE);$('grid').insertAdjacentHTML('beforeend',next.map(card).join(''));shown+=next.length;$('more').hidden=shown>=filtered.length;$('count').textContent=`符合 ${filtered.length} / ${DATA.length} 件 · 已顯示 ${shown} 件`;}
function apply(){const q=$('q').value.trim().toLocaleLowerCase(),shop=$('shop').value,veh=$('vehicle').value,ex=$('extra').value,lo=$('min').value===''?null:Number($('min').value),hi=$('max').value===''?null:Number($('max').value);
// 選「機車」或「自行車」時也要帶出兩用款，否則兩用款會被藏起來
filtered=DATA.filter(d=>(!q||d.name.toLocaleLowerCase().includes(q))&&(!shop||d.shop_type===shop)&&(!veh||d.vehicle===veh||((veh==='機車'||veh==='自行車')&&d.vehicle==='機車＋自行車'))&&(!ex||d.extras.includes(ex))&&(lo===null||d.price>=lo)&&(hi===null||d.price<=hi));
const by={priceAsc:(a,b)=>a.price-b.price,priceDesc:(a,b)=>b.price-a.price,name:(a,b)=>a.name.localeCompare(b.name,'zh-TW')}[$('sort').value];filtered.sort(by);shown=0;$('grid').innerHTML=filtered.length?'':'<p class="empty">沒有符合條件的商品，請調整搜尋或篩選。</p>';append();}
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(apply,180)});
['shop','vehicle','extra','min','max','sort'].forEach(id=>$(id).addEventListener('input',apply));
$('more').addEventListener('click',append);$('reset').addEventListener('click',()=>{clearTimeout(timer);['q','min','max','shop','vehicle','extra'].forEach(id=>$(id).value='');$('sort').value='priceAsc';apply()});apply();
</script></body></html>
