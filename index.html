function apply(){const q=$('q').value.trim().toLocaleLowerCase(),shop=$('shop').value,lo=$('min').value===''?null:Number($('min').value),hi=$('max').value===''?null:Number($('max').value);filtered=DATA.filter(d=>(!q||(d.name+' '+d.shop_type+' '+d.age_evidence).toLocaleLowerCase().includes(q))&&(!shop||d.shop_type===shop)&&(lo===null||(d.price!==null&&d.price>=lo))&&(hi===null||(d.price!==null&&d.price<=hi)));const by={priceAsc:(a,b)=>(a.price??Infinity)-(b.price??Infinity),priceDesc:(a,b)=>(b.price??-1)-(a.price??-1),original:(a,b)=>a.index-b.index,name:(a,b)=>a.name.localeCompare(b.name,'zh-TW')}[$('sort').value];filtered.sort(by);shown=0;$('grid').innerHTML=filtered.length?'':'<p class="empty">沒有符合條件的商品，請調整搜尋或價格。</p>';append();}
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(apply,180)});
['shop','min','max','sort'].forEach(id=>$(id).addEventListener('input',apply));
$('more').addEventListener('click',append);$('reset').addEventListener('click',()=>{clearTimeout(timer);['q','min','max','shop'].forEach(id=>$(id).value='');$('sort').value='priceAsc';apply()});apply();
</script></body></html>
